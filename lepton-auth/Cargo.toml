[features]
default = []
hydrate = [
    "leptos/hydrate",
    "dep:web-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:photon-leptos",
    "dep:higgs-macros",
    "photon-leptos/hydrate",
]
# Enables publish-capture helpers for validating Photon hooks in integration tests.
test-utils = ["lepton-identity?/test-utils"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:tokio",
    "dep:axum",
    "dep:axum-login",
    "dep:tower-sessions",
    "dep:argon2",
    "dep:password-hash",
    "dep:sha2",
    "dep:rand_core",
    "dep:anyhow",
    "dep:valence",
    "dep:async-trait",
    "dep:higgs",
    "dep:higgs-macros",
    "dep:lepton-host-adapter",
    "dep:lepton-identity",
    "dep:photon",
    "dep:photon-leptos",
    "dep:tracing",
    "dep:futures",
    "dep:reqwest",
    "lepton-host-adapter/ssr",
    "higgs/ssr",
    "photon/runtime",
    "photon-leptos/ssr",
]
# Verification / reset mail delivery (not email-as-login).
email = ["dep:lepton-smtp"]
# SMS OTP + lepton-sms adapters.
phone = ["dep:lepton-sms"]
# TOTP verify / enroll QR (totp-rs + qrcode SVG on SSR) + AEAD seed seal.
totp = ["dep:totp-rs", "dep:qrcode", "dep:chacha20poly1305", "dep:base64"]
# Alias for totp.
two_factor = ["totp"]
# WebAuthn passkey ceremony for AuthDevice kind=webauthn (server-side verify).
webauthn = ["dep:webauthn-rs", "dep:uuid"]
# OAuth provider flags (cfg only). Live HTTP exchange needs `ssr` (which already
# enables `reqwest`). Mock provider works with `ssr` alone via
# `OAuthClientConfig::use_mock_provider`.
oauth-google = []
oauth-github = []
# Durable Boson delivery + DeliveryAttempt log (requires host Boson + DeliveryRuntime).
boson-delivery = [
    "dep:boson-core",
    "dep:boson-macros",
    "dep:boson-runtime",
    "dep:boson-valence-identity",
    "dep:quark",
    "dep:uuid",
]
# All Ship channels + OAuth flags + WebAuthn.
full = ["email", "phone", "totp", "oauth-google", "oauth-github", "webauthn"]
# Emit auth funnel Spectra counters / failure events via lepton-spectra-telemetry.
spectra = ["dep:lepton-spectra-telemetry"]

[[test]]
name = "delivery_attempt"
required-features = ["ssr", "boson-delivery", "email"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
serde_json = { workspace = true }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
url = { workspace = true }
boson-backend-mem = { workspace = true }
boson-core = { workspace = true }
boson-runtime = { workspace = true }
boson-valence-identity = { workspace = true }
