[package]
name = "lepton-auth"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Auth server functions, password policy, factors, OAuth, and token helpers"
publish = false

[dependencies]
leptos = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

http = { workspace = true }
cfg-if = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
axum-login = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
password-hash = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

valence = { workspace = true, optional = true }
chrono = { workspace = true }
async-trait = { workspace = true, optional = true }
higgs = { workspace = true, optional = true }
higgs-macros = { workspace = true, optional = true }
lepton-smtp = { workspace = true, optional = true }
lepton-sms = { workspace = true, optional = true }
lepton-spectra-telemetry = { workspace = true, optional = true }
lepton-host-adapter = { workspace = true, optional = true }
lepton-identity = { workspace = true, optional = true }
photon = { workspace = true, optional = true }
photon-leptos = { workspace = true, optional = true, default-features = false }
totp-rs = { workspace = true, optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }
chacha20poly1305 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
webauthn-rs = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
boson-core = { workspace = true, optional = true }
boson-macros = { workspace = true, optional = true }
boson-runtime = { workspace = true, optional = true }
boson-valence-identity = { workspace = true, optional = true }
quark = { workspace = true, optional = true }

wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Window",
    "Navigator",
    "CredentialsContainer",
] }

