[package]
name = "lepton-host-adapter"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Axum-login backend + token schemas; bridges lepton-identity to higgs-identity / higgs-host"
publish = false

[dependencies]
lepton-identity = { path = "../lepton-identity", default-features = false }
meson = { workspace = true }
higgs-identity = { workspace = true }
higgs-core = { workspace = true, optional = true }
higgs-host = { workspace = true, features = ["ssr"] }
valence = { workspace = true }
leptos = { workspace = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true, features = ["multipart"] }
axum-login = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
password-hash = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
http = { workspace = true, optional = true }
photon-axum = { workspace = true, optional = true, default-features = false, features = ["runtime"] }

[build-dependencies]
valence-codegen = { workspace = true }

[lints]
workspace = true

[features]
default = ["db-sqlite"]
db-sqlite = ["lepton-identity/db-sqlite", "valence/sqlite", "meson/db-sqlite", "meson/backend-local"]
db-hybrid = ["lepton-identity/db-hybrid", "valence/hybrid", "meson/db-hybrid", "meson/backend-local"]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:axum-login",
    "dep:tokio",
    "dep:serde_json",
    "dep:async-trait",
    "dep:argon2",
    "dep:sha2",
    "dep:password-hash",
    "dep:rand_core",
    "dep:anyhow",
    "dep:chrono",
    "dep:http",
    "dep:photon-axum",
    "dep:higgs-core",
    "dep:uuid",
    "dep:thiserror",
    "dep:tracing",
    "leptos/ssr",
    "higgs-host/ssr"]

[dev-dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json"] }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-sessions = { workspace = true }
lepton-identity = { path = "../lepton-identity", default-features = false, features = ["db-sqlite"] }
valence = { workspace = true }

[[example]]
name = "axum_session_snapshot"
required-features = ["ssr"]
