[package]
name = "lepton-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CI e2e + interactive live Twilio / TOTP / Google / GitHub OAuth E2E for Lepton"
publish = false

[[bin]]
name = "lepton-live-verify"
path = "src/bin/lepton-live-verify.rs"
required-features = ["live-twilio"]

[[bin]]
name = "lepton-live-totp"
path = "src/bin/lepton-live-totp.rs"

[[bin]]
name = "lepton-live-oauth"
path = "src/bin/lepton-live-oauth.rs"
required-features = ["live-oauth"]

[[bin]]
name = "lepton-sms-sink"
path = "src/bin/lepton-sms-sink.rs"

[[bin]]
name = "lepton-mock-oidc"
path = "src/bin/lepton-mock-oidc.rs"

[features]
# CI e2e exercises durable Boson SMS/email delivery by default.
default = ["boson-delivery"]
# Live Twilio SendGrid email + Messages SMS (never CI).
live-twilio = ["lepton-smtp/twilio", "lepton-sms/twilio"]
# Live Google OAuth token exchange (never CI).
live-oauth-google = ["lepton-auth/oauth-google"]
# Live GitHub OAuth token exchange (never CI).
live-oauth-github = ["lepton-auth/oauth-github"]
live-oauth-microsoft = ["lepton-auth/oauth-microsoft"]
# Operator CLI: Google and/or GitHub live OAuth.
live-oauth = ["live-oauth-google", "live-oauth-github", "live-oauth-microsoft"]
# Durable Boson delivery: shared Valence + MemQueue worker via boot_lab.
boson-delivery = [
    "lepton-auth/boson-delivery",
    "dep:boson-runtime",
    "dep:boson-backend-mem",
    "dep:boson-valence-identity",
]

[dependencies]
lepton-auth = { workspace = true, features = ["ssr", "email", "phone", "totp"] }
lepton-host-adapter = { workspace = true, features = ["ssr", "db-sqlite"] }
lepton-identity = { workspace = true, features = ["db-sqlite"] }
lepton-smtp = { workspace = true }
lepton-sms = { workspace = true }
valence = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "net", "time"] }
totp-rs = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
axum = { workspace = true, features = ["form"] }
boson-runtime = { workspace = true, optional = true }
boson-backend-mem = { workspace = true, optional = true }
boson-valence-identity = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }

[lints.rust]
missing_docs = "allow"

[lints.clippy]
unwrap_used = "allow"
expect_used = "allow"
print_stdout = "allow"
print_stderr = "allow"
