# Settings for run-lanes.sh. Paths are relative to the repo root.
BUILD_CMD="cargo leptos build --project lepton-auth-ui-e2e"   # as in ci.yml
PROFILE=debug
SERVER_BIN=lepton-auth-ui-e2e      # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=lepton-auth-ui-e2e/site
OUTPUT_NAME=lepton-auth-ui-e2e
PORT=3120                          # lane i serves on PORT + 100 + i
BASE_HOST=localhost                # WebAuthn's rp_origin is http://localhost:<port>
READY_PATH=/health
SERVER_CWD=root                    # the host reads Cargo.toml at startup; its state is in memory
SERVER_ENV="LEPTON_TOTP_ALLOW_TEST_SEAL_KEY=1"   # as in ci.yml
LANE_ENV=""
LANES_DEFAULT=8

# Each lane gets its own Mailpit (docker), SMS sink and mock OIDC, so one
# lane clearing its inbox can't race another. The host and the specs read
# these variables; unset, they default to the single-host ports.
lane_setup() {
  local i=$1 port=$2 smtp=$((21000 + PORT + $1)) api=$((22000 + PORT + $1))
  export UF_SMTP_PORT=$smtp UF_MAILPIT_URL="http://127.0.0.1:$api"
  export UF_SMS_SINK_URL="http://127.0.0.1:$((23000 + PORT + i))"
  export UF_MOCK_OIDC_URL="http://127.0.0.1:$((24000 + PORT + i))"
  export UF_PUBLIC_BASE_URL="http://localhost:$port"
  docker rm -f "lanes-mailpit-$PORT-$i" >/dev/null 2>&1
  docker run -d --rm --name "lanes-mailpit-$PORT-$i" -p "127.0.0.1:$smtp:1025" -p "127.0.0.1:$api:8025" \
    -e MP_SMTP_AUTH_ACCEPT_ANY=1 -e MP_SMTP_AUTH_ALLOW_INSECURE=1 axllent/mailpit:v1.21 >"$3/mailpit.id" 2>"$3/mailpit.log" || return 1
  for _ in $(seq 60); do curl -sf -o /dev/null "$UF_MAILPIT_URL/api/v1/info" && return 0; sleep 0.5; done
  echo "run-lanes: Mailpit for lane $i never became ready" >&2
}
lane_teardown() { docker rm -f "lanes-mailpit-$PORT-$1" >/dev/null 2>&1; }
