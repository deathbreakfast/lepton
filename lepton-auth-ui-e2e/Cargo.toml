[package]
name = "lepton-auth-ui-e2e"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Library-owned Leptos host for lepton-auth-ui Playwright flows"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lepton-auth = { workspace = true, default-features = false }
lepton-auth-ui = { workspace = true, default-features = false }
lepton-host-adapter = { workspace = true, default-features = false, optional = true, features = ["db-sqlite"] }
lepton-identity = { workspace = true, default-features = false, optional = true, features = ["db-sqlite"] }
lepton-smtp = { workspace = true, optional = true }
lepton-sms = { workspace = true, optional = true }
# default-features off: lepton-e2e's default `boson-delivery` would unify onto
# lepton-auth and force queued send without DeliveryRuntime on this host.
lepton-e2e = { path = "../lepton-e2e", optional = true, default-features = false }
lepton-test-support = { path = "../lepton-test-support", optional = true, features = ["axum"] }
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true, default-features = true }
orbital-base-components = { workspace = true }
orbital-core-components = { workspace = true }
orbital-primitives = { workspace = true, default-features = false }
orbital-theme = { workspace = true, default-features = false }
cfg-if = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }
tower-http = { version = "0.6", optional = true, features = ["fs"] }
tower-sessions = { workspace = true, optional = true }
axum-login = { workspace = true, optional = true }
higgs = { workspace = true, optional = true }
higgs-identity = { workspace = true, optional = true }
valence = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { workspace = true, optional = true }
tracing-wasm = { version = "0.2", optional = true }
url = { workspace = true }
urlencoding = { workspace = true }
boson-runtime = { workspace = true, optional = true }
boson-backend-mem = { workspace = true, optional = true }
boson-valence-identity = { workspace = true, optional = true }

[features]
default = []
oauth-google = ["lepton-auth/oauth-google", "lepton-auth-ui/oauth-google"]
oauth-github = ["lepton-auth/oauth-github", "lepton-auth-ui/oauth-github"]
oauth-microsoft = ["lepton-auth/oauth-microsoft", "lepton-auth-ui/oauth-microsoft"]
hydrate = [
    "leptos/hydrate",
    "lepton-auth/hydrate",
    "lepton-auth-ui/hydrate",
    "oauth-google",
    "oauth-github",
    "oauth-microsoft",
    "orbital-primitives/hydrate",
    "orbital-theme/hydrate",
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "dep:tracing-wasm",
    "webauthn-ui",
]
# Client UI for passkeys (does not pull `webauthn-rs` onto wasm).
webauthn-ui = []
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:anyhow",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tower-http",
    "dep:tower-sessions",
    "dep:axum-login",
    "dep:higgs",
    "dep:higgs-identity",
    "dep:valence",
    "dep:chrono",
    "dep:async-trait",
    "dep:lepton-host-adapter",
    "dep:lepton-identity",
    "dep:lepton-smtp",
    "dep:lepton-sms",
    "dep:lepton-e2e",
    "dep:lepton-test-support",
    "dep:reqwest",
    "higgs/ssr",
    "orbital-primitives/ssr",
    "orbital-theme/ssr",
    "lepton-auth/ssr",
    "lepton-auth/email",
    "lepton-auth/phone",
    "lepton-auth/totp",
    "oauth-google",
    "oauth-github",
    "oauth-microsoft",
    "lepton-auth/webauthn",
    "lepton-auth-ui/ssr",
    "lepton-host-adapter/ssr",
    "webauthn-ui",
]
# Opt-in durable Boson delivery for this host (off by default; Playwright stays sync).
boson-delivery = [
    "lepton-auth/boson-delivery",
    "dep:boson-runtime",
    "dep:boson-backend-mem",
    "dep:boson-valence-identity",
]

[[bin]]
name = "lepton-auth-ui-e2e"
path = "src/main.rs"
required-features = ["ssr"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
